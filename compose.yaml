services:
  postgres:
    image: postgres:18
    container_name: hazel-postgres
    environment:
      POSTGRES_DB: hazel
      POSTGRES_USER: hazel
      POSTGRES_PASSWORD: hazel-dev-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hazel -d hazel"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - hazel-postgres-data:/var/lib/postgresql

volumes:
  hazel-postgres-data:
