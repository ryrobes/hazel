services:
  postgres:
    image: postgres:18
    container_name: hazel-postgres
    environment:
      POSTGRES_DB: hazel
      POSTGRES_USER: hazel
      POSTGRES_PASSWORD: hazel-dev-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hazel -d hazel"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - hazel-postgres-data:/var/lib/postgresql

  mysql:
    image: mysql:8.4
    container_name: hazel-mysql
    environment:
      MYSQL_DATABASE: hazel
      MYSQL_USER: hazel
      MYSQL_PASSWORD: hazel-dev-only
      MYSQL_ROOT_PASSWORD: hazel-root-dev-only
    ports:
      - "127.0.0.1:55433:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - hazel-mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro

volumes:
  hazel-postgres-data:
  hazel-mysql-data:
